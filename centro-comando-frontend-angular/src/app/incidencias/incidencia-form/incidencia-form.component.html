<h2>{{ incidenciaId ? 'Editar incidencia' : 'Nueva incidencia' }}</h2>

<div class="alert alert-danger" *ngIf="erroresIncidencia['non_field_errors']">
  {{ erroresIncidencia['non_field_errors'][0] }}
</div>

<form [formGroup]="form" (ngSubmit)="guardar()" class="card p-4" style="max-width: 560px;">
  <div class="mb-3">
    <label class="form-label">Servidor afectado</label>
    <select class="form-select" formControlName="servidor">
      <option [ngValue]="null" disabled>Selecciona un servidor</option>
      <option *ngFor="let s of servidores" [ngValue]="s.id">{{ s.nombre_host }}</option>
    </select>
    <div class="text-danger small" *ngIf="form.controls.servidor.touched && form.controls.servidor.invalid">
      Debes seleccionar un servidor.
    </div>
    <div class="text-danger small" *ngIf="erroresIncidencia['servidor']">{{ erroresIncidencia['servidor'][0] }}</div>
  </div>

  <div class="mb-3">
    <label class="form-label">Título</label>
    <input type="text" class="form-control" formControlName="titulo" placeholder="Ej: Caída del servicio Nginx" />
    <div class="text-danger small" *ngIf="form.controls.titulo.touched && form.controls.titulo.invalid">
      El título es obligatorio.
    </div>
    <div class="text-danger small" *ngIf="erroresIncidencia['titulo']">{{ erroresIncidencia['titulo'][0] }}</div>
  </div>

  <div class="mb-3">
    <label class="form-label">Descripción</label>
    <textarea class="form-control" rows="4" formControlName="descripcion" placeholder="Detalle técnico del fallo o alerta detectada"></textarea>
    <div class="text-danger small" *ngIf="form.controls.descripcion.touched && form.controls.descripcion.invalid">
      La descripción es obligatoria.
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Severidad</label>
    <select class="form-select" formControlName="severidad">
      <option *ngFor="let n of niveles" [value]="n.value">{{ n.label }}</option>
    </select>
  </div>

  <div class="form-check mb-3">
    <input type="checkbox" class="form-check-input" id="resuelta" formControlName="resuelta" />
    <label class="form-check-label" for="resuelta">¿Incidencia resuelta?</label>
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary" [disabled]="guardando">
      {{ guardando ? 'Guardando...' : 'Guardar' }}
    </button>
    <a [routerLink]="form.controls.servidor.value ? ['/servidores', form.controls.servidor.value] : ['/incidencias']" class="btn btn-outline-secondary">Cancelar</a>
  </div>
</form>
